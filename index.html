<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Snake Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Expanded header with live stats -->
        <header class="game-header">
            <div class="stats-group">
                <div class="score-board">SCORE: <span id="score">0</span></div>
                <div class="highscore-board">HI-SCORE: <span id="highScore">0</span></div>
            </div>
            <button id="restart-btn">RESET</button>
        </header>

        <!-- The Canvas dynamically scales up inside this viewport wrapper -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Permanent On-Screen Control Pad for Universal Playability -->
        <div id="onscreen-controls">
            <button class="ctrl-btn up" id="ctrl-up">▲</button>
            <div class="horizontal-ctrls">
                <button class="ctrl-btn left" id="ctrl-left">◀</button>
                <div class="spacer"></div>
                <button class="ctrl-btn right" id="ctrl-right">▶</button>
            </div>
            <button class="ctrl-btn down" id="ctrl-down">▼</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
